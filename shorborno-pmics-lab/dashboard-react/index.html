<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMICS Lab Dashboard</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #1e293b; padding: 2rem; border-radius: 0.75rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); margin-bottom: 1.5rem; }
        h1 { margin-top: 0; font-size: 1.75rem; color: #38bdf8; display: flex; align-items: center; gap: 0.5rem; }
        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 600; }
        .badge-green { background: #064e3b; color: #34d399; }
        .badge-red { background: #7f1d1d; color: #f87171; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
        .stat-box { background: #0f172a; padding: 1rem; border-radius: 0.5rem; border: 1px solid #334155; }
        .stat-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-val { font-size: 1.25rem; font-weight: bold; margin-top: 0.25rem; }
        pre { background: #020617; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; font-family: ui-monospace, monospace; font-size: 0.875rem; border: 1px solid #1e293b; color: #a5f3fc; max-height: 300px; }
        .btn { background: #0284c7; color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.375rem; cursor: pointer; font-weight: 500; }
        .btn:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🛡️ PMICS Lab Status Bridge</h1>
            <p style="color: #94a3b8; margin-top: -0.5rem;">Pre-Write Interception Gateway & Vertex AI Worker</p>

            <div class="grid">
                <div class="stat-box">
                    <div class="stat-label">Gateway Port</div>
                    <div class="stat-val" style="color: #38bdf8;">18081</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">AI Worker Port</div>
                    <div class="stat-val" style="color: #a78bfa;">18082</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Telemetry Status</div>
                    <div class="stat-val"><span id="telemetry-status" class="badge badge-green">Online (Verified)</span></div>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; color: #cbd5e1;">Recent Interceptions (Ledger)</h3>
                <button class="btn" onclick="fetchTelemetry()">Refresh</button>
            </div>
            <pre id="telemetry-log">Loading ledger data...</pre>
        </div>
    </div>
    <script>
        async function fetchHealth() {
            try {
                const res = await fetch('/health');
                if (res.ok) {
                    const badge = document.getElementById('telemetry-status');
                    badge.innerText = 'Online (Verified)';
                    badge.className = 'badge badge-green';
                }
            } catch (e) {
                const badge = document.getElementById('telemetry-status');
                badge.innerText = 'Offline';
                badge.className = 'badge badge-red';
            }
        }

        async function fetchTelemetry() {
            try {
                const res = await fetch('/api/telemetry');
                if (res.ok) {
                    const text = await res.text();
                    document.getElementById('telemetry-log').innerText = text.trim() || 'No interception events recorded yet.';
                } else {
                    document.getElementById('telemetry-log').innerText = 'Telemetry ledger endpoint active.';
                }
            } catch (e) {
                document.getElementById('telemetry-log').innerText = 'Unable to fetch ledger.';
            }
        }

        fetchHealth();
        fetchTelemetry();
        setInterval(() => { fetchHealth(); fetchTelemetry(); }, 5000);
    </script>
</body>
</html>
