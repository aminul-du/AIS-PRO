name: pre-commit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "chore/**"]
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Governance Manifests
        run: |
          test -f docs/ARCHITECTURE.md
          test -f infra/mcore-edge-manifest.yaml
          test -f docs/evidence/pulse-snapshot.json
